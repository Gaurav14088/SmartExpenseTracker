
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Expense | SpendSmart</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { background:#0c0b12; color:#f5f3ff; font-family:Arial,sans-serif; }
        .confirm-box { max-width:520px; margin:100px auto; padding:28px; background:#15131f; border:1px solid #393247; border-radius:16px; }
        .button { border:0; border-radius:8px; padding:12px 16px; cursor:pointer; text-decoration:none; display:inline-block; }
        .danger { background:#b42335; color:white; }
        .cancel { background:#30293a; color:white; margin-left:8px; }
    </style>
</head>
<body>
    <main class="confirm-box">
        <h1>Delete Expense?</h1>
        <p>Are you sure you want to delete this expense?</p>

        <p><strong>{{ expense.title }}</strong></p>
        <p>Amount: ₹{{ expense.amount|floatformat:2 }}</p>
        <p>Date: {{ expense.date|date:"d M Y" }}</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button danger">Yes, Delete</button>
            <a href="{% url 'transactions' %}" class="button cancel">Cancel</a>
        </form>
    </main>
</body>
</html>
